openapi: 3.0.3
info:
  title: Vanilla PHP Playground API
  version: 1.0.0
  description: >-
    Product catalog and cart API. The API is sessionless; a cart id is an
    unguessable UUID that grants access to the cart. Monetary amounts are strings in minor currency units
    (for example grosze) with an ISO 4217 currency code. Errors use RFC 9457
    problem details.
paths:
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List products using keyset pagination
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: The next_cursor value returned by the previous page.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A page of products ordered by id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/products/{id}:
    get:
      operationId: getProduct
      summary: Get one product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/carts:
    post:
      operationId: createCart
      summary: Create an empty cart
      responses:
        '201':
          description: The created cart.
          headers:
            Location:
              description: URL of the created cart.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
  /api/v1/carts/{id}:
    get:
      operationId: getCart
      summary: Get a cart at current prices
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: The cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/carts/{id}/items/{productId}:
    put:
      operationId: setLineItemQuantity
      summary: Set the quantity of a product in an open cart
      description: Idempotent; a quantity of 0 removes the product.
      parameters:
        - $ref: '#/components/parameters/CartId'
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 0
                  maximum: 99
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/carts/{id}/checkout:
    post:
      operationId: checkoutCart
      summary: Reserve stock and place an order for an open cart
      description: >-
        Requires an Idempotency-Key header. Repeating the request with the same
        key and cart returns the same order; using the key for another cart is
        rejected with 422. Stock stays reserved until reservation_expires_at.
      parameters:
        - $ref: '#/components/parameters/CartId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        '201':
          description: The placed order.
          headers:
            Location:
              description: URL of the order.
              schema:
                type: string
            ETag:
              description: Strong entity tag of the order version, for If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel a pending order and release its reserved stock
      description: >-
        Uses optimistic locking: send the ETag from the last read in If-Match.
        A missing header returns 428 and a stale one returns 412.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The cancelled order.
          headers:
            ETag:
              description: Strong entity tag of the order version, for If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The order.
          headers:
            ETag:
              description: Strong entity tag of the order version, for If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    CartId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An RFC 9457 problem details response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?\d+$'
          description: Amount in minor currency units.
          example: '1999'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: PLN
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, price, available_quantity]
      properties:
        id:
          type: integer
          minimum: 1
        sku:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        price:
          $ref: '#/components/schemas/Money'
        available_quantity:
          type: integer
          minimum: 0
    ProductPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: integer
          minimum: 1
          nullable: true
    LineItem:
      type: object
      additionalProperties: false
      required: [product_id, sku, name, quantity, unit_price, line_total]
      properties:
        product_id:
          type: integer
          minimum: 1
        sku:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        unit_price:
          $ref: '#/components/schemas/Money'
        line_total:
          $ref: '#/components/schemas/Money'
    Cart:
      type: object
      additionalProperties: false
      required: [id, status, items, total]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, checked_out]
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        total:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: Null for an empty cart.
    Order:
      type: object
      additionalProperties: false
      required: [id, status, items, total, reservation_expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending_payment, paid, cancelled, expired]
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineItem'
        total:
          $ref: '#/components/schemas/Money'
        reservation_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
