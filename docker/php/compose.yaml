# Base definition for every service that runs the backend image; compose.yaml extends it.
# The whole repository is mounted so the backend can read the shared openapi/ contract.
# Relative paths here resolve from this directory.
services:
  app:
    build:
      context: ../..
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: "8.5"
    working_dir: /app/backend
    volumes:
      - ../..:/app
