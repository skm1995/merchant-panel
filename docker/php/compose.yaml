# Base definitions for the services that run the backend image. In development and tests
# (compose.yaml) the whole repository is mounted so the backend can read the shared openapi/
# contract; in production the code is part of the image that bin/publish-images builds in CI
# and compose.prod.yaml names. Relative paths here resolve from this directory.
services:
  app:
    build:
      context: ../..
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        PHP_VERSION: "8.5"
    working_dir: /app/backend
    volumes:
      - ../..:/app

  app-prod:
    restart: unless-stopped
