# Responses name neither the Apache version nor the operating system.
ServerTokens Prod
ServerSignature Off

# Sessions live in Redis, so merchants stay signed in when the web container is replaced on
# deployment and every web container shares them. The values come from the environment.
php_value session.save_handler redis
php_value session.save_path "tcp://${REDIS_HOST}:${REDIS_PORT}?database=${REDIS_SESSION_DATABASE}"

<VirtualHost *:80>
    DocumentRoot /app/backend/public

    <Directory /app/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
