# Responses name neither the Apache version nor the operating system.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /app/backend/public

    <Directory /app/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
