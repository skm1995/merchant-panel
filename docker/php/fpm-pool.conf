; PHP-FPM settings for the backend; Caddy sends /api/ and /legacy/ requests here over FastCGI.
[global]
; Application logs are JSON lines on stderr; keep long ones, such as stack traces, whole.
log_limit = 65536

[www]
; The application logs every request itself, with its request id.
access.log = /dev/null

; Docker's health check asks FastCGI for this path.
ping.path = /ping

; Sessions live in Redis, so merchants stay signed in when the container is replaced on
; deployment and every web container shares them. The values come from the environment; short
; timeouts keep requests quick when Redis is down.
php_value[session.save_handler] = redis
php_value[session.save_path] = "tcp://${REDIS_HOST}:${REDIS_PORT}?database=${REDIS_SESSION_DATABASE}&timeout=0.5&read_timeout=1"
