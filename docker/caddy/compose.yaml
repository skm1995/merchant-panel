# Base definition for the reverse proxy in front of the frontend and the backend; compose.yaml
# extends it. Relative paths here resolve from this directory.
services:
  caddy:
    image: caddy:2.10.2-alpine
    volumes:
      - ../..:/app:ro
      - ./backend.caddy:/etc/caddy/backend.caddy:ro
      - ./headers.caddy:/etc/caddy/headers.caddy:ro
      - ./access-log.caddy:/etc/caddy/access-log.caddy:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
