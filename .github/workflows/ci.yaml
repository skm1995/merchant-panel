name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run CI verification
        run: bin/ci
      - name: Show service logs
        if: failure()
        run: docker compose --profile test logs --no-color
      - name: Stop services
        if: always()
        run: docker compose --profile test down --volumes
