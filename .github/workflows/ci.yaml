name: CI

on:
  push:
  pull_request:

# The jobs only read the repository; the deploy reaches the server with its own SSH key.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run CI verification
        run: bin/ci
      - name: Show service logs
        if: failure()
        run: docker compose --profile test logs --no-color
      - name: Summarize coverage
        if: always()
        run: |
          cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          jq -r '"Frontend line coverage: \(.total.lines.pct)%."' frontend/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage/html
            frontend/coverage
          if-no-files-found: ignore
      - name: Stop services
        if: always()
        run: docker compose --profile test down --volumes

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Deploy to the server
        run: bin/deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          FAKEPAY_WEBHOOK_SECRET: ${{ secrets.FAKEPAY_WEBHOOK_SECRET }}
          QUICKPAY_WEBHOOK_SECRET: ${{ secrets.QUICKPAY_WEBHOOK_SECRET }}
          REPORTS_API_KEY: ${{ secrets.REPORTS_API_KEY }}
          ORDER_ACCESS_SECRET: ${{ secrets.ORDER_ACCESS_SECRET }}
          MAILPIT_PASSWORD: ${{ secrets.MAILPIT_PASSWORD }}
          BACKUP_UPLOAD_URL: ${{ secrets.BACKUP_UPLOAD_URL }}
