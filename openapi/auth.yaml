paths:
  session:
    get:
      operationId: getSession
      summary: Describe the browser session and issue its CSRF token
      description: >-
        Starts the session when needed. Send the returned csrf_token in the X-CSRF-Token
        header of every state-changing request to a session route.
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema:
                $ref: '#/schemas/Session'
    post:
      operationId: signIn
      summary: Sign in with email and password
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/Credentials'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/schemas/Session'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
        '403':
          $ref: 'shared.yaml#/responses/Problem'
        '429':
          $ref: 'shared.yaml#/responses/TooManyRequests'
    delete:
      operationId: signOut
      summary: Sign out
      security:
        - csrfToken: []
      responses:
        '204':
          description: Signed out.
        '403':
          $ref: 'shared.yaml#/responses/Problem'
  registrations:
    post:
      operationId: register
      summary: Create an account and send the email confirmation
      description: >-
        Answers 202 whether or not the address already has an account, so it never reveals
        which addresses are registered: a new address gets the confirmation email, the
        owner of an unverified account who repeats the registration with its password gets
        it again within a resend limit, and the owner of any other existing account gets a
        notice to sign in instead.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/Credentials'
      responses:
        '202':
          description: The confirmation email is on its way.
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '403':
          $ref: 'shared.yaml#/responses/Problem'
        '422':
          $ref: 'shared.yaml#/responses/Problem'
        '429':
          $ref: 'shared.yaml#/responses/TooManyRequests'
  emailConfirmations:
    post:
      operationId: confirmEmail
      summary: Confirm an email address with the token from the confirmation email
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/EmailConfirmation'
      responses:
        '204':
          description: The email address is confirmed.
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '403':
          $ref: 'shared.yaml#/responses/Problem'
        '422':
          $ref: 'shared.yaml#/responses/Problem'
schemas:
  Session:
    type: object
    additionalProperties: false
    required: [authenticated, email, merchant, csrf_token]
    properties:
      authenticated:
        type: boolean
      email:
        type: string
        format: email
        nullable: true
      merchant:
        type: boolean
        description: >-
          Whether the signed-in account may use the merchant panel. Registration gives no
          access; an operator grants it with bin/grant-merchant.php.
      csrf_token:
        type: string
        minLength: 1
  Credentials:
    type: object
    additionalProperties: false
    required: [email, password]
    properties:
      email:
        type: string
      password:
        type: string
        format: password
        description: >-
          When registering, at least 8 characters and at most 72 bytes, without NUL
          characters, because bcrypt hashes no more.
  EmailConfirmation:
    type: object
    additionalProperties: false
    required: [token]
    properties:
      token:
        type: string
        minLength: 1
