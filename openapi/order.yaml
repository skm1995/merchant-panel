paths:
  panelOrders:
    get:
      operationId: listPanelOrders
      security:
        - sessionCookie: []
      summary: List orders newest first for the signed-in merchant
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: The next_cursor value returned by the previous page.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/schemas/OrderSummaryPage'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
        '403':
          $ref: 'shared.yaml#/responses/Problem'
  checkout:
    post:
      operationId: checkoutCart
      summary: Reserve stock and place an order for an open cart
      description: >-
        Requires an Idempotency-Key header. Repeating the request with the same
        key and cart returns the same order; using the key for another cart is
        rejected with 422. Stock stays reserved until reservation_expires_at.
      parameters:
        - $ref: 'cart.yaml#/parameters/CartId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        '201':
          description: The placed order.
          headers:
            Location:
              description: URL of the order.
              schema:
                type: string
            ETag:
              description: Strong entity tag of the order version, for If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/schemas/Order'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '404':
          $ref: 'shared.yaml#/responses/Problem'
        '409':
          $ref: 'shared.yaml#/responses/Problem'
        '422':
          $ref: 'shared.yaml#/responses/Problem'
        '429':
          $ref: 'shared.yaml#/responses/TooManyRequests'
  order:
    get:
      operationId: getOrder
      summary: Get an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The order.
          headers:
            ETag:
              description: Strong entity tag of the order version, for If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/schemas/Order'
        '404':
          $ref: 'shared.yaml#/responses/Problem'
  orderCancellation:
    post:
      operationId: cancelOrder
      summary: Cancel a pending order and release its reserved stock
      description: >-
        Uses optimistic locking: send the ETag from the last read in If-Match.
        A missing header returns 428 and a stale one returns 412.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The cancelled order.
          headers:
            ETag:
              description: Strong entity tag of the order version, for If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/schemas/Order'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '404':
          $ref: 'shared.yaml#/responses/Problem'
        '409':
          $ref: 'shared.yaml#/responses/Problem'
        '412':
          $ref: 'shared.yaml#/responses/Problem'
        '428':
          $ref: 'shared.yaml#/responses/Problem'
schemas:
  OrderSummaryPage:
    type: object
    additionalProperties: false
    required: [data, next_cursor]
    properties:
      data:
        type: array
        items:
          $ref: '#/schemas/OrderSummary'
      next_cursor:
        type: string
        format: uuid
        nullable: true
  OrderSummary:
    type: object
    additionalProperties: false
    required: [id, status, total, created_at]
    properties:
      id:
        type: string
        format: uuid
      status:
        type: string
        enum: [pending_payment, paid, cancelled, expired]
      total:
        $ref: 'shared.yaml#/schemas/Money'
      created_at:
        type: string
        format: date-time
  Order:
    type: object
    additionalProperties: false
    required: [id, status, items, total, reservation_expires_at, created_at]
    properties:
      id:
        type: string
        format: uuid
      status:
        type: string
        enum: [pending_payment, paid, cancelled, expired]
      items:
        type: array
        minItems: 1
        items:
          $ref: 'shared.yaml#/schemas/LineItem'
      total:
        $ref: 'shared.yaml#/schemas/Money'
      reservation_expires_at:
        type: string
        format: date-time
      created_at:
        type: string
        format: date-time
