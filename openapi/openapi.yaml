openapi: 3.0.3
info:
  title: Merchant Panel API
  version: 1.0.0
  description: >-
    Shop and merchant panel API. Shop routes are sessionless; a cart id is an
    unguessable UUID that grants access to the cart. Panel routes (session,
    registrations, email confirmations, password resets) use the browser session cookie and require
    the session's CSRF token in the X-CSRF-Token header for state changes. Monetary amounts are strings in minor currency units
    (for example grosze) with an ISO 4217 currency code. Errors use RFC 9457
    problem details.
paths:
  /api/v1/session:
    $ref: 'auth.yaml#/paths/session'
  /api/v1/registrations:
    $ref: 'auth.yaml#/paths/registrations'
  /api/v1/email-confirmations:
    $ref: 'auth.yaml#/paths/emailConfirmations'
  /api/v1/password-resets:
    $ref: 'auth.yaml#/paths/passwordResets'
  /api/v1/password-reset-confirmations:
    $ref: 'auth.yaml#/paths/passwordResetConfirmations'
  /api/v1/products:
    $ref: 'catalog.yaml#/paths/products'
  /api/v1/products/{id}:
    $ref: 'catalog.yaml#/paths/product'
  /api/v1/carts:
    $ref: 'cart.yaml#/paths/carts'
  /api/v1/carts/{id}:
    $ref: 'cart.yaml#/paths/cart'
  /api/v1/carts/{id}/items/{productId}:
    $ref: 'cart.yaml#/paths/cartItem'
  /api/v1/carts/{id}/checkout:
    $ref: 'order.yaml#/paths/checkout'
  /api/v1/orders/{id}/cancel:
    $ref: 'order.yaml#/paths/orderCancellation'
  /api/v1/orders/{id}:
    $ref: 'order.yaml#/paths/order'
  /api/v1/orders/{id}/payments:
    $ref: 'payment.yaml#/paths/orderPayments'
  /api/v1/payments/{id}:
    $ref: 'payment.yaml#/paths/payment'
  /api/v1/payments/webhooks/{provider}:
    $ref: 'payment.yaml#/paths/webhook'
  /api/v1/panel/products/{id}:
    $ref: 'catalog.yaml#/paths/panelProduct'
  /api/v1/panel/orders:
    $ref: 'order.yaml#/paths/panelOrders'
  /api/v1/panel/simulations:
    $ref: 'simulation.yaml#/paths/simulations'
  /api/v1/panel/simulations/current:
    $ref: 'simulation.yaml#/paths/currentSimulation'
  /api/v1/panel/reports/daily-revenue:
    $ref: 'report.yaml#/paths/panelDailyRevenue'
  /api/v1/panel/reports/top-products:
    $ref: 'report.yaml#/paths/panelTopProducts'
  /api/v1/panel/reports/stock-outlook:
    $ref: 'report.yaml#/paths/panelStockOutlook'
  /api/v1/panel/reports/order-heatmap:
    $ref: 'report.yaml#/paths/panelOrderHeatmap'
  /api/v1/panel/reports/monthly-revenue:
    $ref: 'report.yaml#/paths/panelMonthlyRevenue'
  /api/v1/reports/daily-revenue:
    $ref: 'report.yaml#/paths/dailyRevenue'
  /api/v1/reports/top-products:
    $ref: 'report.yaml#/paths/topProducts'
  /api/v1/reports/stock-outlook:
    $ref: 'report.yaml#/paths/stockOutlook'
  /api/v1/reports/order-heatmap:
    $ref: 'report.yaml#/paths/orderHeatmap'
  /api/v1/reports/monthly-revenue:
    $ref: 'report.yaml#/paths/monthlyRevenue'
components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The csrf_token returned by GET /api/v1/session, required by state-changing panel routes.
    sessionCookie:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: The browser session of a signed-in merchant, set by POST /api/v1/session.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Key for integrations, such as the reporting API.
