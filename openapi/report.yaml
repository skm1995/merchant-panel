paths:
  dailyRevenue:
    get:
      operationId: getDailyRevenueReport
      security:
        - apiKey: []
      summary: Revenue of paid orders per day with a running total
      description: Requires the reporting API key. Days without paid orders are omitted.
      parameters:
        - $ref: '#/parameters/From'
        - $ref: '#/parameters/To'
        - $ref: '#/parameters/Currency'
      responses:
        '200':
          $ref: '#/responses/DailyRevenue'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
  topProducts:
    get:
      operationId: getTopProductsReport
      security:
        - apiKey: []
      summary: Products ranked by revenue from paid orders
      description: >-
        Requires the reporting API key. Returns at most `limit` products, highest
        revenue first; products with equal revenue are ordered by product id.
      parameters:
        - $ref: '#/parameters/From'
        - $ref: '#/parameters/To'
        - $ref: '#/parameters/Currency'
        - $ref: '#/parameters/Limit'
      responses:
        '200':
          $ref: '#/responses/TopProducts'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
  panelDailyRevenue:
    get:
      operationId: getPanelDailyRevenueReport
      security:
        - sessionCookie: []
      summary: Daily revenue for the signed-in merchant
      description: The daily revenue report for the merchant panel, authorized by the session.
      parameters:
        - $ref: '#/parameters/From'
        - $ref: '#/parameters/To'
        - $ref: '#/parameters/Currency'
      responses:
        '200':
          $ref: '#/responses/DailyRevenue'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
        '403':
          $ref: 'shared.yaml#/responses/Problem'
  panelTopProducts:
    get:
      operationId: getPanelTopProductsReport
      security:
        - sessionCookie: []
      summary: Top products for the signed-in merchant
      description: The top products report for the merchant panel, authorized by the session.
      parameters:
        - $ref: '#/parameters/From'
        - $ref: '#/parameters/To'
        - $ref: '#/parameters/Currency'
        - $ref: '#/parameters/Limit'
      responses:
        '200':
          $ref: '#/responses/TopProducts'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
        '403':
          $ref: 'shared.yaml#/responses/Problem'
  stockOutlook:
    get:
      operationId: getStockOutlookReport
      security:
        - apiKey: []
      summary: Products that will sell out first
      description: >-
        Requires the reporting API key. Products that will sell out first at the pace of the last 28 days, from the daily sales summary: units sold per day and the days the available stock lasts. Products without sales in those days are omitted.
      parameters:
        - $ref: '#/parameters/Limit'
      responses:
        '200':
          $ref: '#/responses/StockOutlook'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
  orderHeatmap:
    get:
      operationId: getOrderHeatmapReport
      security:
        - apiKey: []
      summary: Paid orders per weekday and hour
      description: >-
        Requires the reporting API key. Paid orders in any currency counted per weekday (1 is Monday) and hour in UTC, for a heatmap of when customers buy. Cells without orders are omitted.
      parameters:
        - $ref: '#/parameters/From'
        - $ref: '#/parameters/To'
      responses:
        '200':
          $ref: '#/responses/OrderHeatmap'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
  monthlyRevenue:
    get:
      operationId: getMonthlyRevenueReport
      security:
        - apiKey: []
      summary: Monthly revenue compared with the year before
      description: >-
        Requires the reporting API key. Revenue of paid orders per month for the last twelve months, including the current one, from the daily sales summary, next to the same month a year earlier.
      parameters:
        - $ref: '#/parameters/Currency'
      responses:
        '200':
          $ref: '#/responses/MonthlyRevenue'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
  panelStockOutlook:
    get:
      operationId: getPanelStockOutlookReport
      security:
        - sessionCookie: []
      summary: Stock outlook for the signed-in merchant
      description: >-
        The stock outlook report for the merchant panel, authorized by the session.
      parameters:
        - $ref: '#/parameters/Limit'
      responses:
        '200':
          $ref: '#/responses/StockOutlook'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
        '403':
          $ref: 'shared.yaml#/responses/Problem'
  panelOrderHeatmap:
    get:
      operationId: getPanelOrderHeatmapReport
      security:
        - sessionCookie: []
      summary: Order heatmap for the signed-in merchant
      description: >-
        The order heatmap report for the merchant panel, authorized by the session.
      parameters:
        - $ref: '#/parameters/From'
        - $ref: '#/parameters/To'
      responses:
        '200':
          $ref: '#/responses/OrderHeatmap'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
        '403':
          $ref: 'shared.yaml#/responses/Problem'
  panelMonthlyRevenue:
    get:
      operationId: getPanelMonthlyRevenueReport
      security:
        - sessionCookie: []
      summary: Monthly revenue for the signed-in merchant
      description: >-
        The monthly revenue report for the merchant panel, authorized by the session.
      parameters:
        - $ref: '#/parameters/Currency'
      responses:
        '200':
          $ref: '#/responses/MonthlyRevenue'
        '400':
          $ref: 'shared.yaml#/responses/Problem'
        '401':
          $ref: 'shared.yaml#/responses/Problem'
        '403':
          $ref: 'shared.yaml#/responses/Problem'
parameters:
  From:
    name: from
    in: query
    required: true
    schema:
      type: string
      format: date
  To:
    name: to
    in: query
    required: true
    schema:
      type: string
      format: date
  Currency:
    name: currency
    in: query
    required: false
    schema:
      type: string
      pattern: '^[A-Z]{3}$'
      default: PLN
  Limit:
    name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 50
      default: 10
responses:
  DailyRevenue:
    description: Daily revenue in the period.
    content:
      application/json:
        schema:
          $ref: '#/schemas/DailyRevenueReport'
  TopProducts:
    description: Ranked products in the period.
    content:
      application/json:
        schema:
          $ref: '#/schemas/TopProductsReport'
  StockOutlook:
    description: Products that will sell out first.
    content:
      application/json:
        schema:
          $ref: '#/schemas/StockOutlookReport'
  OrderHeatmap:
    description: Paid orders per weekday and hour in the period.
    content:
      application/json:
        schema:
          $ref: '#/schemas/OrderHeatmapReport'
  MonthlyRevenue:
    description: Monthly revenue with the same month a year earlier.
    content:
      application/json:
        schema:
          $ref: '#/schemas/MonthlyRevenueReport'
schemas:
  DailyRevenueReport:
    type: object
    additionalProperties: false
    required: [from, to, currency, days]
    properties:
      from:
        type: string
        format: date
      to:
        type: string
        format: date
      currency:
        type: string
      days:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [day, orders, revenue, running_total]
          properties:
            day:
              type: string
              format: date
            orders:
              type: integer
              minimum: 1
            revenue:
              $ref: 'shared.yaml#/schemas/Money'
            running_total:
              $ref: 'shared.yaml#/schemas/Money'
  TopProductsReport:
    type: object
    additionalProperties: false
    required: [from, to, currency, products]
    properties:
      from:
        type: string
        format: date
      to:
        type: string
        format: date
      currency:
        type: string
      products:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [rank, product_id, sku, name, units_sold, revenue]
          properties:
            rank:
              type: integer
              minimum: 1
            product_id:
              type: integer
            sku:
              type: string
            name:
              type: string
            units_sold:
              type: integer
            revenue:
              $ref: 'shared.yaml#/schemas/Money'
  StockOutlookReport:
    type: object
    additionalProperties: false
    required: [days_measured, products]
    properties:
      days_measured:
        type: integer
        description: The number of past days, ending yesterday, whose sales set the pace.
      products:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [product_id, sku, name, available, units_sold, units_per_day, days_left]
          properties:
            product_id:
              type: integer
            sku:
              type: string
            name:
              type: string
            available:
              type: integer
              minimum: 0
              description: Stock that is not reserved by open orders.
            units_sold:
              type: integer
              minimum: 1
            units_per_day:
              type: number
              description: Units sold per day, rounded to two decimal places.
            days_left:
              type: integer
              minimum: 0
              description: Whole days the available stock lasts at that pace.
  OrderHeatmapReport:
    type: object
    additionalProperties: false
    required: [from, to, cells]
    properties:
      from:
        type: string
        format: date
      to:
        type: string
        format: date
      cells:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [weekday, hour, orders]
          properties:
            weekday:
              type: integer
              minimum: 1
              maximum: 7
              description: ISO weekday, 1 is Monday.
            hour:
              type: integer
              minimum: 0
              maximum: 23
              description: Hour in UTC.
            orders:
              type: integer
              minimum: 1
  MonthlyRevenueReport:
    type: object
    additionalProperties: false
    required: [currency, months]
    properties:
      currency:
        type: string
      months:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [month, revenue, previous_year_revenue, change_percent]
          properties:
            month:
              type: string
              pattern: '^[0-9]{4}-[0-9]{2}$'
            revenue:
              $ref: 'shared.yaml#/schemas/Money'
            previous_year_revenue:
              $ref: 'shared.yaml#/schemas/Money'
            change_percent:
              type: number
              nullable: true
              description: >-
                Change against the same month a year earlier, in percent rounded to one decimal
                place; null when that month had no revenue.
