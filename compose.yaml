x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    PHP_VERSION: "8.5"

x-messenger-environment: &messenger-environment
  MESSENGER_EMAILS_DSN: ${MESSENGER_EMAILS_DSN:-amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/emails}
  MESSENGER_ORDERS_DSN: ${MESSENGER_ORDERS_DSN:-amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/orders}
  MESSENGER_CATALOG_DSN: ${MESSENGER_CATALOG_DSN:-amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/catalog}
  MESSENGER_FAILED_DSN: ${MESSENGER_FAILED_DSN:-amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/failed_messages}

x-test-messenger-environment: &test-messenger-environment
  MESSENGER_EMAILS_DSN: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/emails_test
  MESSENGER_ORDERS_DSN: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/orders_test
  MESSENGER_CATALOG_DSN: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/catalog_test
  MESSENGER_FAILED_DSN: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/failed_messages_test

x-test-app-environment: &test-app-environment
  APP_BASE_URL: ${TEST_APP_BASE_URL:-http://host.docker.internal:8081}

x-payment-environment: &payment-environment
  FAKEPAY_CHECKOUT_URL: ${FAKEPAY_CHECKOUT_URL:-http://localhost:8080/fakepay}
  FAKEPAY_WEBHOOK_SECRET: ${FAKEPAY_WEBHOOK_SECRET:-local-fakepay-webhook-secret}
  QUICKPAY_CHECKOUT_URL: ${QUICKPAY_CHECKOUT_URL:-http://localhost:8080/quickpay}
  QUICKPAY_WEBHOOK_SECRET: ${QUICKPAY_WEBHOOK_SECRET:-local-quickpay-webhook-secret}

x-reports-environment: &reports-environment
  REPORTS_API_KEY: ${REPORTS_API_KEY:-local-reports-api-key}

x-redis-environment: &redis-environment
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DATABASE: 0

x-test-redis-environment: &test-redis-environment
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DATABASE: 1

x-mailer-environment: &mailer-environment
  MAILER_DSN: ${MAILER_DSN:-smtp://mailhog:1025}
  MAILER_FROM: ${MAILER_FROM:-no-reply@example.com}

x-database-environment: &database-environment
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE:-app}
  DB_USERNAME: ${MYSQL_USER:-app}
  DB_PASSWORD: ${MYSQL_PASSWORD:-app}

x-test-database-environment: &test-database-environment
  <<: *database-environment
  DB_DATABASE: app_test

services:
  php:
    build: *php-build
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: [*database-environment, *messenger-environment, *payment-environment, *redis-environment, *reports-environment]
      ORDER_RESERVATION_SECONDS: ${ORDER_RESERVATION_SECONDS:-900}
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: *php-build
    working_dir: /var/www/html
    command: php bin/worker.php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      <<: [*database-environment, *messenger-environment, *mailer-environment, *redis-environment]
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  php-test:
    build: *php-build
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - test
    environment:
      <<: [*test-database-environment, *test-app-environment, *payment-environment, *test-redis-environment, *reports-environment]
      XDEBUG_MODE: "off"
      MAILHOG_API_BASE_URL: ${MAILHOG_API_BASE_URL:-http://mailhog:8025}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  php-test-web:
    build: *php-build
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8081:80"
    profiles:
      - test
    environment:
      <<: [*test-database-environment, *payment-environment, *test-redis-environment, *reports-environment]
      ORDER_RESERVATION_SECONDS: 3
      XDEBUG_MODE: "off"
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox-relay:
    build: *php-build
    working_dir: /var/www/html
    command: php bin/outbox-relay.php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      <<: [*database-environment, *messenger-environment]
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox-relay-test:
    build: *php-build
    working_dir: /var/www/html
    command: php bin/outbox-relay.php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    profiles:
      - test
    environment:
      <<: [*test-database-environment, *test-messenger-environment]
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-test:
    build: *php-build
    working_dir: /var/www/html
    command: php bin/worker.php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    profiles:
      - test
    environment:
      <<: [*test-database-environment, *test-messenger-environment, *mailer-environment, *test-app-environment, *test-redis-environment]
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
  rabbitmq_data:
