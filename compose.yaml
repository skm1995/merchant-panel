services:
  migrate:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: composer migrate
    env_file:
      - docker/env/database.env
    depends_on:
      mysql:
        condition: service_healthy

  migrate-test:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: composer migrate
    profiles:
      - test
    env_file:
      - docker/env/database.env
      - docker/env/database-test.env
    depends_on:
      mysql:
        condition: service_healthy

  php:
    extends:
      file: docker/php/compose.yaml
      service: app
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 2s
      timeout: 3s
      retries: 30
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/messenger.env
      - docker/env/payment.env
      - docker/env/redis.env
      - docker/env/reports.env
      - docker/env/order-access.env
      - docker/env/rate-limit.env
      - docker/env/load-test.env
      - docker/env/simulation.env
    environment:
      ORDER_RESERVATION_SECONDS: ${ORDER_RESERVATION_SECONDS:-900}
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: php bin/worker.php
    restart: unless-stopped
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/messenger.env
      - docker/env/mailer.env
      - docker/env/redis.env
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  php-test:
    extends:
      file: docker/php/compose.yaml
      service: app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - test
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/database-test.env
      - docker/env/messenger-test.env
      - docker/env/mailer.env
      - docker/env/app-test.env
      - docker/env/payment.env
      - docker/env/redis.env
      - docker/env/redis-test.env
      - docker/env/reports.env
      - docker/env/order-access.env
      - docker/env/rate-limit.env
      - docker/env/rate-limit-test.env
      - docker/env/load-test.env
      - docker/env/simulation.env
      - docker/env/simulation-test.env
      - docker/env/demo.env
    environment:
      ORDER_RESERVATION_SECONDS: 3
      XDEBUG_MODE: "off"
      MAILPIT_API_BASE_URL: ${MAILPIT_API_BASE_URL:-http://mailpit:8025}
      # Functional tests run the simulator's load generator against the test proxy.
      SIMULATION_BASE_URL: http://caddy-test
      SIMULATION_RESOLVE_HOST: caddy-test
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  php-test-web:
    extends:
      file: docker/php/compose.yaml
      service: app
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 2s
      timeout: 3s
      retries: 30
    profiles:
      - test
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/database-test.env
      - docker/env/payment.env
      - docker/env/redis.env
      - docker/env/redis-test.env
      - docker/env/reports.env
      - docker/env/order-access.env
      - docker/env/rate-limit.env
      - docker/env/rate-limit-test.env
      - docker/env/load-test.env
      - docker/env/simulation.env
      - docker/env/simulation-test.env
    environment:
      ORDER_RESERVATION_SECONDS: 3
      XDEBUG_MODE: "off"
      SESSION_COOKIE_SECURE: "false"
      # Adds docker/php/coverage/coverage.ini to the image's configuration, so every request
      # records its coverage while bin/ci collects it.
      PHP_INI_SCAN_DIR: ":/app/docker/php/coverage"
    depends_on:
      migrate-test:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox-relay:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: php bin/outbox-relay.php
    restart: unless-stopped
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/messenger.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox-relay-test:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: php bin/outbox-relay.php
    restart: unless-stopped
    profiles:
      - test
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/database-test.env
      - docker/env/messenger-test.env
    depends_on:
      migrate-test:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-test:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: php bin/worker.php
    restart: unless-stopped
    profiles:
      - test
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/database-test.env
      - docker/env/messenger-test.env
      - docker/env/mailer.env
      - docker/env/app-test.env
      - docker/env/redis.env
      - docker/env/redis-test.env
    depends_on:
      migrate-test:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started


  # Runs Black Friday simulations started in the panel: consumes only the simulation queue
  # and sends its buyers' requests through Caddy, like customers.
  simulator:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: php bin/simulator.php
    restart: unless-stopped
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/messenger.env
      - docker/env/payment.env
      - docker/env/redis.env
      - docker/env/load-test.env
      - docker/env/simulation.env
    environment:
      SIMULATION_BASE_URL: http://caddy
      SIMULATION_RESOLVE_HOST: caddy
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  simulator-test:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: php bin/simulator.php
    restart: unless-stopped
    profiles:
      - test
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/database-test.env
      - docker/env/messenger-test.env
      - docker/env/payment.env
      - docker/env/redis.env
      - docker/env/redis-test.env
      - docker/env/load-test.env
      - docker/env/simulation.env
      - docker/env/simulation-test.env
    environment:
      SIMULATION_BASE_URL: http://caddy-test
      SIMULATION_RESOLVE_HOST: caddy-test
    depends_on:
      migrate-test:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  caddy:
    extends:
      file: docker/caddy/compose.yaml
      service: caddy
    ports:
      - "8080:80"
    volumes:
      - ./docker/caddy/dev.Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      php:
        condition: service_healthy
      frontend:
        condition: service_started

  # Serves the frontend build from frontend/dist, so bin/ci builds it before starting.
  caddy-test:
    extends:
      file: docker/caddy/compose.yaml
      service: caddy
    ports:
      - "8081:80"
    profiles:
      - test
    volumes:
      - ./docker/caddy/test.Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      php-test-web:
        condition: service_healthy

  frontend:
    extends:
      file: docker/node/compose.yaml
      service: node
    command: sh -c "[ -d node_modules ] || npm ci; npm run dev"
    depends_on:
      php:
        condition: service_healthy

  # Runs frontend checks through `docker compose run`; it has no long-running process, so it
  # lives in the tools profile that `docker compose up` does not start.
  frontend-test:
    extends:
      file: docker/node/compose.yaml
      service: node
    profiles:
      - tools

  # Drives a real browser through caddy-test; runs through `docker compose run` like
  # frontend-test, so it lives in the tools profile.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app/frontend
    volumes:
      - .:/app
    profiles:
      - tools
    env_file:
      - docker/env/e2e.env
      - docker/env/demo.env

  # Load test runner for bin/loadtest; it targets the test stack behind caddy-test.
  k6:
    image: grafana/k6:1.4.0
    profiles:
      - tools
    volumes:
      - ./loadtest:/loadtest:ro
    env_file:
      - docker/env/loadtest.env
      - docker/env/payment.env

  mysql:
    image: mysql:26.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Observability stack, started with `docker compose --profile observability up -d`.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    profiles:
      - observability
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 5s
      retries: 40

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0
    profiles:
      - observability
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5601/api/status"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Sets up log retention, the "Application logs" data view, and the dashboards once Kibana
  # is up; production runs the same script.
  kibana-setup:
    image: curlimages/curl:8.16.0
    profiles:
      - observability
    volumes:
      - ./docker/elk:/elk:ro
    entrypoint: ["/bin/sh", "/elk/setup.sh"]
    environment:
      KIBANA_URL: http://kibana:5601
    depends_on:
      kibana:
        condition: service_healthy

  vector:
    image: timberio/vector:0.50.0-alpine
    profiles:
      - observability
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      COMPOSE_PROJECT: merchant-panel
    volumes:
      - ./docker/elk/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  mysql_data:
  rabbitmq_data:
  elasticsearch_data:

# A fixed project name keeps container, network, and volume names, and the Vector log filter,
# independent of the directory the repository is cloned into.
name: merchant-panel
