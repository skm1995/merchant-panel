services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: "8.5"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-app}
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-amqp://app:app@rabbitmq:5672/%2f/emails}
      MESSENGER_FAILURE_TRANSPORT_DSN: ${MESSENGER_FAILURE_TRANSPORT_DSN:-amqp://app:app@rabbitmq:5672/%2f/emails_failed}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailhog:1025}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      MAILER_FROM: ${MAILER_FROM:-no-reply@example.com}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: "8.5"
    working_dir: /var/www/html
    command: php bin/worker.php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-amqp://app:app@rabbitmq:5672/%2f/emails}
      MESSENGER_FAILURE_TRANSPORT_DSN: ${MESSENGER_FAILURE_TRANSPORT_DSN:-amqp://app:app@rabbitmq:5672/%2f/emails_failed}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailhog:1025}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      MAILER_FROM: ${MAILER_FROM:-no-reply@example.com}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  php-test:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: "8.5"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - test
    environment:
      XDEBUG_MODE: "off"
      SESSION_COOKIE_SECURE: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: app_test
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-amqp://app:app@rabbitmq:5672/%2f/emails}
      MESSENGER_FAILURE_TRANSPORT_DSN: ${MESSENGER_FAILURE_TRANSPORT_DSN:-amqp://app:app@rabbitmq:5672/%2f/emails_failed}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailhog:1025}
      APP_BASE_URL: ${APP_BASE_URL:-http://host.docker.internal:8081}
      MAILER_FROM: ${MAILER_FROM:-no-reply@example.com}
      MAILHOG_API_BASE_URL: ${MAILHOG_API_BASE_URL:-http://mailhog:8025}
    depends_on:
      mysql:
        condition: service_healthy

  php-test-web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: "8.5"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8081:80"
    profiles:
      - test
    environment:
      XDEBUG_MODE: "off"
      SESSION_COOKIE_SECURE: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: app_test
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-amqp://app:app@rabbitmq:5672/%2f/emails}
      MESSENGER_FAILURE_TRANSPORT_DSN: ${MESSENGER_FAILURE_TRANSPORT_DSN:-amqp://app:app@rabbitmq:5672/%2f/emails_failed}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailhog:1025}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      MAILER_FROM: ${MAILER_FROM:-no-reply@example.com}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
  rabbitmq_data:
