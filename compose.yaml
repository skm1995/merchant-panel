services:
  migrate:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: composer migrate
    env_file:
      - docker/env/database.env
    depends_on:
      mysql:
        condition: service_healthy

  migrate-test:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: composer migrate
    profiles:
      - test
    env_file:
      - docker/env/database.env
      - docker/env/database-test.env
    depends_on:
      mysql:
        condition: service_healthy

  php:
    extends:
      file: docker/php/compose.yaml
      service: app
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/"]
      interval: 2s
      timeout: 3s
      retries: 30
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - docker/env/database.env
      - docker/env/messenger.env
      - docker/env/payment.env
      - docker/env/redis.env
      - docker/env/reports.env
    environment:
      ORDER_RESERVATION_SECONDS: ${ORDER_RESERVATION_SECONDS:-900}
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: php bin/worker.php
    restart: unless-stopped
    env_file:
      - docker/env/database.env
      - docker/env/messenger.env
      - docker/env/mailer.env
      - docker/env/redis.env
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  php-test:
    extends:
      file: docker/php/compose.yaml
      service: app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - test
    env_file:
      - docker/env/database.env
      - docker/env/database-test.env
      - docker/env/messenger-test.env
      - docker/env/mailer.env
      - docker/env/app-test.env
      - docker/env/payment.env
      - docker/env/redis.env
      - docker/env/redis-test.env
      - docker/env/reports.env
    environment:
      ORDER_RESERVATION_SECONDS: 3
      XDEBUG_MODE: "off"
      MAILHOG_API_BASE_URL: ${MAILHOG_API_BASE_URL:-http://mailhog:8025}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  php-test-web:
    extends:
      file: docker/php/compose.yaml
      service: app
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/"]
      interval: 2s
      timeout: 3s
      retries: 30
    profiles:
      - test
    env_file:
      - docker/env/database.env
      - docker/env/database-test.env
      - docker/env/payment.env
      - docker/env/redis.env
      - docker/env/redis-test.env
      - docker/env/reports.env
    environment:
      ORDER_RESERVATION_SECONDS: 3
      XDEBUG_MODE: "off"
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      migrate-test:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox-relay:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: php bin/outbox-relay.php
    restart: unless-stopped
    env_file:
      - docker/env/database.env
      - docker/env/messenger.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox-relay-test:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: php bin/outbox-relay.php
    restart: unless-stopped
    profiles:
      - test
    env_file:
      - docker/env/database.env
      - docker/env/database-test.env
      - docker/env/messenger-test.env
    depends_on:
      migrate-test:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-test:
    extends:
      file: docker/php/compose.yaml
      service: app
    command: php bin/worker.php
    restart: unless-stopped
    profiles:
      - test
    env_file:
      - docker/env/database.env
      - docker/env/database-test.env
      - docker/env/messenger-test.env
      - docker/env/mailer.env
      - docker/env/app-test.env
      - docker/env/redis.env
      - docker/env/redis-test.env
    depends_on:
      migrate-test:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
  rabbitmq_data:
