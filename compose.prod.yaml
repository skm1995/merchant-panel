# Production on one server, deployed by bin/deploy after CI passes. The images contain the
# code and are built in CI by bin/publish-images, tagged with the commit; the server only pulls
# them. Command-line processes run as www-data rather than root, and only Caddy publishes
# ports. Values come from the .env file bin/deploy writes next to this file; the variable
# groups in docker/env/ are shared with development.
# The Compose project keeps the repository's earlier name: its volumes, including the
# database, are named after it, so renaming it would start production with empty volumes.
name: vanilla-php-playground

services:
  migrate:
    extends:
      file: docker/php/compose.yaml
      service: app-prod
    # The backend image of the deployed commit; every PHP service below runs the same one.
    image: &php-image ${IMAGES:?IMAGES is required}/php:${IMAGE_TAG:?IMAGE_TAG is required}
    command: composer migrate
    user: www-data
    restart: "no"
    env_file:
      - docker/env/database.env
    depends_on:
      mysql:
        condition: service_healthy

  # Adds the demo catalog when it is missing; products edited in the panel stay as they are.
  # bin/deploy runs it with `docker compose run`, so it lives in the tools profile.
  seed-demo:
    extends:
      file: docker/php/compose.yaml
      service: app-prod
    image: *php-image
    command: composer seed-demo
    user: www-data
    restart: "no"
    profiles:
      - tools
    env_file:
      - docker/env/database.env
    depends_on:
      migrate:
        condition: service_completed_successfully

  php:
    extends:
      file: docker/php/compose.yaml
      service: app-prod
    image: *php-image
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 30
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/messenger.env
      - docker/env/payment.env
      - docker/env/redis.env
      - docker/env/reports.env
      - docker/env/order-access.env
      - docker/env/rate-limit.env
      - docker/env/load-test.env
      - docker/env/simulation.env
    environment:
      ORDER_RESERVATION_SECONDS: 900
      SESSION_COOKIE_SECURE: "true"
      # Secrets are required here, so production never falls back to the public development
      # values in docker/env/*.env.
      FAKEPAY_WEBHOOK_SECRET: ${FAKEPAY_WEBHOOK_SECRET:?FAKEPAY_WEBHOOK_SECRET is required}
      QUICKPAY_WEBHOOK_SECRET: ${QUICKPAY_WEBHOOK_SECRET:?QUICKPAY_WEBHOOK_SECRET is required}
      ORDER_ACCESS_SECRET: ${ORDER_ACCESS_SECRET:?ORDER_ACCESS_SECRET is required}
      REPORTS_API_KEY: ${REPORTS_API_KEY:?REPORTS_API_KEY is required}
      LOAD_TEST_KEY: ${LOAD_TEST_KEY:?LOAD_TEST_KEY is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    extends:
      file: docker/php/compose.yaml
      service: app-prod
    image: *php-image
    command: php bin/worker.php
    user: www-data
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/messenger.env
      - docker/env/mailer.env
      - docker/env/redis.env
    environment:
      APP_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  outbox-relay:
    extends:
      file: docker/php/compose.yaml
      service: app-prod
    image: *php-image
    command: php bin/outbox-relay.php
    user: www-data
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/messenger.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Runs the Black Friday simulations merchants start in the panel: consumes only the
  # simulation queue and sends its buyers through the public address, which inside the server
  # resolves to the Caddy container.
  simulator:
    extends:
      file: docker/php/compose.yaml
      service: app-prod
    image: *php-image
    command: php bin/simulator.php
    user: www-data
    env_file:
      - docker/env/logging.env
      - docker/env/database.env
      - docker/env/messenger.env
      - docker/env/payment.env
      - docker/env/redis.env
      - docker/env/load-test.env
      - docker/env/simulation.env
    environment:
      SIMULATION_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      SIMULATION_RESOLVE_HOST: caddy
      FAKEPAY_WEBHOOK_SECRET: ${FAKEPAY_WEBHOOK_SECRET:?FAKEPAY_WEBHOOK_SECRET is required}
      QUICKPAY_WEBHOOK_SECRET: ${QUICKPAY_WEBHOOK_SECRET:?QUICKPAY_WEBHOOK_SECRET is required}
      LOAD_TEST_KEY: ${LOAD_TEST_KEY:?LOAD_TEST_KEY is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  caddy:
    image: ${IMAGES:?IMAGES is required}/caddy:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      MAIL_DOMAIN: ${MAIL_DOMAIN:?MAIL_DOMAIN is required}
      MAILPIT_PASSWORD_HASH: ${MAILPIT_PASSWORD_HASH:?MAILPIT_PASSWORD_HASH is required}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      php:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # The server has 24 GB of memory: an 8 GB buffer pool keeps the sales history and its
    # indexes in memory, and a larger redo log speeds up its bulk generation. Without
    # replicas, point-in-time recovery, or change data capture (backups are dumps), the
    # binary log would only write every change a second time.
    command: ["--innodb-buffer-pool-size=8G", "--innodb-redo-log-capacity=2G", "--disable-log-bin"]
    # Only on the server's loopback, for a database client through an SSH tunnel; the
    # firewall and Oracle's security list keep everything but 80 and 443 closed anyway.
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: unless-stopped

  # Log search: Vector ships every container's logs to Elasticsearch, and Kibana shows them
  # under /kibana/ on the mail domain, behind the same password as Mailpit. Elasticsearch
  # keeps seven days of logs on one node and listens only inside the Compose network.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    mem_limit: 3g
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: https://${MAIL_DOMAIN:?MAIL_DOMAIN is required}/kibana
      TELEMETRY_OPTIN: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    mem_limit: 1536m
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5601/kibana/api/status"]
      interval: 5s
      timeout: 5s
      retries: 120

  # Sets up log retention, the data view, and the dashboards; bin/deploy runs it after every
  # deploy with `docker compose run`, so it lives in the tools profile.
  kibana-setup:
    image: curlimages/curl:8.16.0
    restart: "no"
    profiles:
      - tools
    volumes:
      - ./docker/elk:/elk:ro
    entrypoint: ["/bin/sh", "/elk/setup.sh"]
    environment:
      KIBANA_URL: http://kibana:5601/kibana
    depends_on:
      kibana:
        condition: service_healthy

  vector:
    image: timberio/vector:0.50.0-alpine
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      COMPOSE_PROJECT: vanilla-php-playground
    volumes:
      - ./docker/elk/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  mysql_data:
  rabbitmq_data:
  redis_data:
  caddy_data:
  caddy_config:
  elasticsearch_data:
